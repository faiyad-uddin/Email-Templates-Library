<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Password Reset</title>

  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 0; }
    .container { max-width: 600px; background: #ffffff; margin: auto; padding: 25px; border-radius: 6px; }
    .button { background: #007BFF; color: white; padding: 14px 20px; text-decoration: none; border-radius: 4px; display: inline-block; }
    .footer { font-size: 12px; text-align: center; color: #777; margin-top: 25px; }
  </style>
</head>

<body>
  <div class="container">
    <h2>Password Reset Request</h2>
    <p>Hello {{first_name}},</p>

    <p>It looks like you requested to reset your password. Click the button below:</p>

    <p>
      <a href="{{reset_link}}" class="button">Reset Password</a>
    </p>

    <p>If you did not request this, you can safely ignore this email.</p>

    <div class="footer">
      <p>{{unsubscribe_link}}</p>
    </div>
  </div>
</body>
</html>
